branches:
  - main

repositoryUrl: https://github.com/delivery-station/ds.git

tagFormat: v${version}

plugins:
  - '@semantic-release/commit-analyzer'
  - '@semantic-release/release-notes-generator'
  - - '@semantic-release/exec'
    - prepareCmd: |
        # Update version in go.mod if needed
        echo "Preparing release ${nextRelease.version}"
      publishCmd: |
        # Build multi-platform binaries
        echo "Building release artifacts for ${nextRelease.version}"
        
        # Linux AMD64
        GOOS=linux GOARCH=amd64 make build
        tar -czf bin/ds-linux-amd64.tar.gz -C bin ds
        rm bin/ds
        
        # Linux ARM64
        GOOS=linux GOARCH=arm64 make build
        tar -czf bin/ds-linux-arm64.tar.gz -C bin ds
        rm bin/ds
        
        # Linux ARM (32-bit)
        GOOS=linux GOARCH=arm GOARM=7 make build
        tar -czf bin/ds-linux-arm.tar.gz -C bin ds
        rm bin/ds
        
        # macOS AMD64 (Intel)
        GOOS=darwin GOARCH=amd64 make build
        tar -czf bin/ds-darwin-amd64.tar.gz -C bin ds
        rm bin/ds
        
        # macOS ARM64 (Apple Silicon)
        GOOS=darwin GOARCH=arm64 make build
        tar -czf bin/ds-darwin-arm64.tar.gz -C bin ds
        rm bin/ds
        
        # Windows AMD64
        GOOS=windows GOARCH=amd64 make build
        cd bin && zip ds-windows-amd64.zip ds.exe && cd ..
        rm bin/ds.exe
        
        # Windows ARM64
        GOOS=windows GOARCH=arm64 make build
        cd bin && zip ds-windows-arm64.zip ds.exe && cd ..
        rm bin/ds.exe
        
        # Create checksums
        cd bin
        sha256sum ds-* > checksums.txt
        cd ..
  - - '@semantic-release/github'
    - assets:
        - path: bin/ds-linux-amd64.tar.gz
          label: Linux AMD64
        - path: bin/ds-linux-arm64.tar.gz
          label: Linux ARM64
        - path: bin/ds-linux-arm.tar.gz
          label: Linux ARM
        - path: bin/ds-darwin-amd64.tar.gz
          label: macOS Intel
        - path: bin/ds-darwin-arm64.tar.gz
          label: macOS Apple Silicon
        - path: bin/ds-windows-amd64.zip
          label: Windows AMD64
        - path: bin/ds-windows-arm64.zip
          label: Windows ARM64
        - path: bin/checksums.txt
          label: SHA256 Checksums
